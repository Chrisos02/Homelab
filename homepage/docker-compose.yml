version: '3'
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always
    ports:
      - "3001:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=100.x.x.x:3001
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
